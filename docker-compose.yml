# THE INTERNET THROUGH TIME — docker compose
#
#   Production (build + serve):   docker compose up --build      → http://localhost:8080
#   Dev hot-reload (Vite):        docker compose --profile dev up → http://localhost:5173

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: internet-through-time:latest
    ports:
      - "8083:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  dev:
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - ./vite.config.ts:/app/vite.config.ts
      - node_modules:/app/node_modules
    # Vite needs HMR ws upgrade + file watching.
    init: true

volumes:
  node_modules:
